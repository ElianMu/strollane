# Keeps the route server (Render) from going to sleep: a free instance stops after about 15 minutes without a request
# and the first walk after that waits for it to start, then for its caches (2026-11-21: the first walk after a night
# timed out). One cheap GET /api/status every 10 minutes is enough to keep it up.
# Cost: Render counts the hours an instance runs; one service kept up uses about 730 of the 750 free hours a month, so
# a second free service in the same Render workspace would run out. Delete this file to let it sleep again.
# GitHub may start scheduled runs late, and turns them off after 60 days without a commit to the repository.
name: Keep the route server awake
on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:
permissions: {}
jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: GET /api/status
        run: curl -sS -o /dev/null --max-time 120 -w 'HTTP %{http_code} in %{time_total}s\n' https://streetwise-api.onrender.com/api/status || true
