# Publishes the website to GitHub Pages with only the files the browser loads.
#
# The repository also holds the API server's data (routing network, crime and tree databases, area work files), which
# GitHub Pages never needs. With all of Queens the whole tree is over Pages' 1 GB site limit, so this workflow copies the
# repository into _site without those folders and deploys that. Pages must be set to "Source: GitHub Actions"
# (Settings → Pages). The API server on Render still deploys from the full repository.
name: Deploy website (GitHub Pages)

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  # Runs the repository's own test suite (Python unit tests, the GIS reference tests, and the Node/jsdom script
  # tests) before anything is published. Added because nothing previously gated this deploy: a change that broke
  # /api/interpret validation, the routing engine, or a frontend script could ship straight to the live site with
  # no automated check in between (the only other workflow that exercises the live product, production-acceptance.yml,
  # is manual/opt-in). This does not change what ships — only whether a failing build is allowed to.
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Python test dependencies
        run: python3 -m pip install -r requirements.txt -r requirements-dev.txt
      - name: Python unit tests (tests/test_*.py)
        run: python3 -m unittest discover -s tests -p "test_*.py" -v
      - name: GIS reference tests (pytest)
        run: python3 -m pytest tests/test_dimensions.py -q
      - name: Install Node dev dependencies
        run: npm ci
      - name: Node DOM/script tests (tests/*.test.cjs)
        run: npm run test:dom

  deploy:
    needs: test
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url || steps.deployment_again.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Copy the web files into _site
        run: |
          mkdir _site
          tar --exclude=./.git --exclude=./.github --exclude=./_site \
              --exclude=./data/urban --exclude=./data/cache --exclude=./data/dimensions/work --exclude=./data/pedestrian \
              --exclude=./tests --exclude=./scripts --exclude=./routing --exclude='*.py' \
              -cf - . | tar -xf - -C _site
          mkdir -p _site/data/pedestrian
          cp data/pedestrian/score-indicators.json _site/data/pedestrian/
          touch _site/.nojekyll
          # ?v= on every local script and stylesheet, and the service worker's cache name, from the files' contents
          python3 scripts/stamp_assets.py _site
      # Copies of the place photos, served with the site: straight from Wikimedia some of them came back as broken
      # images on iPhones. place-photos.yml downloads them, a little each day, into an Actions cache; this deploy
      # copies what the cache holds (after a 2-minute top-up). Photos not in it yet load from Wikimedia, as before.
      - uses: actions/cache/restore@v4
        with:
          path: .thumb-cache
          key: thumbs-${{ hashFiles('data/places/photos.json') }}-deploy
          restore-keys: |
            thumbs-${{ hashFiles('data/places/photos.json') }}-
            thumbs-
      - name: Copy the place photos into _site
        continue-on-error: true
        timeout-minutes: 6
        run: python3 scripts/fetch_photo_thumbs.py --cache .thumb-cache --out _site/data/places/thumbs --budget 120 --workers 2
      - name: Check the site size
        run: |
          du -sh _site _site/data/places/thumbs 2>/dev/null || true
          size=$(du -sm _site | cut -f1)
          if [ "$size" -gt 990 ]; then echo "::error::_site is ${size} MB; GitHub Pages allows 1 GB"; exit 1; fi
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site
      # The ~850 MB artifact is sometimes not visible to deploy-pages yet ("No artifacts named github-pages were found";
      # it happened to f61b78a and bb599a2c). Wait a minute and deploy once more instead of leaving the site stale.
      - id: deployment
        continue-on-error: true
        uses: actions/deploy-pages@v4
      - name: Wait before deploying again
        if: steps.deployment.outcome == 'failure'
        run: sleep 60
      - id: deployment_again
        if: steps.deployment.outcome == 'failure'
        uses: actions/deploy-pages@v4
