name: Production acceptance and memory monitor
# Manual only in this repository: production (GitHub Pages + the Render API) is deployed from PROD_SOURCE_REPO
# (repository variable, default ElianMu/streetwise). A schedule here would compare that deployment with this
# repo's commits and fail every 6 hours. Run it by hand from the Actions tab to check production health.
on:
  workflow_dispatch:
    inputs:
      live_ai:
        description: 'Make two real billable AI route requests (desktop + mobile emulation)'
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: streetwise-production-acceptance
  cancel-in-progress: false
jobs:
  production:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install real browser test dependencies
        run: |
          python -m pip install playwright==1.62.0
          python -m playwright install --with-deps chromium
      - name: Check actual production and emit reviewable evidence
        env:
          LIVE_AI: ${{ github.event.inputs.live_ai || 'false' }}
          PROD_SOURCE_REPO: ${{ vars.PROD_SOURCE_REPO || 'ElianMu/streetwise' }}
          PROD_SITE: ${{ vars.PROD_SITE || 'https://elianmu.github.io/streetwise/' }}
          PROD_API: ${{ vars.PROD_API || 'https://streetwise-api.onrender.com' }}
          THIS_REPO: ${{ github.repository }}
          THIS_COMMIT: ${{ github.sha }}
        run: |
          args=()
          if [ "$LIVE_AI" = "true" ]; then args+=(--live-ai); fi
          # The deployed commit can only be compared with this run's commit when production is built from this repo.
          if [ "$PROD_SOURCE_REPO" = "$THIS_REPO" ]; then args+=(--expected-commit "$THIS_COMMIT"); else echo "::notice::Production is deployed from $PROD_SOURCE_REPO, not $THIS_REPO: checking its health without the commit match."; fi
          python tests/production_e2e.py --output "$RUNNER_TEMP/streetwise-production" "${args[@]}"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: production-acceptance-evidence
          path: ${{ runner.temp }}/streetwise-production/
          retention-days: 7
